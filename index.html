<!doctype html>
<!--[if lt IE 7 ]> <html lang="en" class="ie6"> <![endif]-->
<!--[if IE 7 ]>    <html lang="en" class="ie7"> <![endif]-->
<!--[if IE 8 ]>    <html lang="en" class="ie8"> <![endif]-->
<!--[if IE 9 ]>    <html lang="en" class="ie9"> <![endif]-->
<!--[if !IE]><!--> <html lang="en"> <!--<![endif]-->
<head>
<script type="text/javascript" src="files/extras/jquery.min.1.7.js"></script>
<script type="text/javascript" src="files//extras/jquery-ui-1.8.20.custom.min.js"></script>
<script type="text/javascript" src="files//extras/jquery.mousewheel.min.js"></script>
<script type="text/javascript" src="files//extras/modernizr.2.5.3.min.js"></script>
<script type="text/javascript" src="files//lib/hash.js"></script>
</head>

<body>

<div class="page-shell">
	<header class="topbar">
		<div class="brand">
			<span class="brand-mark">A</span>
			<div>
				<span class="eyebrow">Premium editorial</span>
				<h1>Your E-book/Booklet/etc</h1>
			</div>
		</div>
		<div class="topbar-meta">
			<span class="status-pill">
				<span class="status-dot"></span>
				Ready to read
			</span>
		</div>
	</header>

	<main class="viewer-panel">
		<div id="canvas">
			<div id="book-zoom">
				<div class="sample-docs">
					<div class="hard cover-front"></div>
					<div class="hard cover-back"></div>
					<div class="hard p29"></div>
					<div class="hard p30"></div>
				</div>
			</div>

			<div class="viewer-controls">
				<button type="button" class="nav-btn icon-btn home-btn" aria-label="Back to home">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-9.5z"/></svg>
				</button>
				<button type="button" class="nav-btn icon-btn prev" aria-label="Previous page">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5.5L9 12l6.5 6.5"/></svg>
				</button>
				<button type="button" class="nav-btn icon-btn next" aria-label="Next page">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.5L15 12l-6.5 6.5"/></svg>
				</button>
				<div class="page-jump-group" aria-label="Jump to page">
					<label for="page-jump">Page</label>
					<input id="page-jump" type="number" min="1" max="30" value="1" />
					<button type="button" class="jump-btn" aria-label="Jump to selected page">Go</button>
				</div>
				<button type="button" class="nav-btn icon-btn fit" aria-label="Fit to viewport">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/><path d="M4 12h16M12 4v16"/></svg>
				</button>
				<button type="button" class="nav-btn icon-btn zoom-out" aria-label="Zoom out">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
				</button>
				<button type="button" class="nav-btn icon-btn zoom-in" aria-label="Zoom in">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
				</button>
				<button type="button" class="nav-btn icon-btn full" aria-label="Toggle fullscreen">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
				</button>
			</div>

			<div id="slider-bar" class="turnjs-slider">
				<div id="slider"></div>
			</div>
		</div>
	</main>
</div>


<script type="text/javascript">

function loadApp() {

	var flipbook = $('.sample-docs');

	// Check if the CSS was already loaded
	
	if (flipbook.width()==0 || flipbook.height()==0) {
		setTimeout(loadApp, 10);
		return;
	}

	// Mousewheel

	$('#book-zoom').mousewheel(function(event, delta, deltaX, deltaY) {

		var data = $(this).data(),
			step = 30,
			flipbook = $('.sample-docs'),
			actualPos = $('#slider').slider('value')*step;

		if (typeof(data.scrollX)==='undefined') {
			data.scrollX = actualPos;
			data.scrollPage = flipbook.turn('page');
		}

		data.scrollX = Math.min($( "#slider" ).slider('option', 'max')*step,
			Math.max(0, data.scrollX + deltaX));

		var actualView = Math.round(data.scrollX/step),
			page = Math.min(flipbook.turn('pages'), Math.max(1, actualView*2 - 2));

		if ($.inArray(data.scrollPage, flipbook.turn('view', page))==-1) {
			data.scrollPage = page;
			flipbook.turn('page', page);
		}

		if (data.scrollTimer)
			clearInterval(data.scrollTimer);
		
		data.scrollTimer = setTimeout(function(){
			data.scrollX = undefined;
			data.scrollPage = undefined;
			data.scrollTimer = undefined;
		}, 1000);

	});

	// Slider

	$( "#slider" ).slider({
		min: 1,
		max: 100,

		start: function(event, ui) {
			if (!window._thumbPreview) {
				_thumbPreview = $('<div />', {'class': 'thumbnail'}).html('<div></div>');
				setPreview(ui.value);
				_thumbPreview.appendTo($(ui.handle));
			} else
				setPreview(ui.value);

			moveBar(false);
		},

		slide: function(event, ui) {
			setPreview(ui.value);
		},

		stop: function() {
			if (window._thumbPreview)
				_thumbPreview.removeClass('show');
			
			$('.sample-docs').turn('page', Math.max(1, $(this).slider('value')*2 - 2));
		}
	});


	// URIs
	
	Hash.on('^page\/([0-9]*)$', {
		yep: function(path, parts) {
			var page = parts[1];

			if (page!==undefined) {
				if ($('.sample-docs').turn('is'))
					$('.sample-docs').turn('page', page);
			}

		},
		nop: function(path) {

			if ($('.sample-docs').turn('is'))
				$('.sample-docs').turn('page', 1);
		}
	});

	// Arrows

	$(document).keydown(function(e){

		var previous = 37, next = 39;

		switch (e.keyCode) {
			case previous:

				$('.sample-docs').turn('previous');

			break;
			case next:
				
				$('.sample-docs').turn('next');

			break;
		}

	});

	// Create the flipbook

	flipbook.turn({
		elevation: 50,
		acceleration: false,
		gradients: true,
		autoCenter: true,
		duration: 1000,
		pages: 30,
		when: {

		turning: function(e, page, view) {
			
			var book = $(this),
			currentPage = book.turn('page'),
			pages = book.turn('pages');
				
			if (currentPage>3 && currentPage<pages-3) {
				if (page==1) {
					book.turn('page', 2).turn('stop').turn('page', page);
					e.preventDefault();
					return;
				} else if (page==pages) {
					book.turn('page', pages-1).turn('stop').turn('page', page);
					e.preventDefault();
					return;
				}
			} else if (page>3 && page<pages-3) {
				if (currentPage==1) {
					book.turn('page', 2).turn('stop').turn('page', page);
					e.preventDefault();
					return;
				} else if (currentPage==pages) {
					book.turn('page', pages-1).turn('stop').turn('page', page);
					e.preventDefault();
					return;
				}
			}

			Hash.go('page/'+page).update();

			if (page==1 || page==pages)
				$('.sample-docs .tabs').hide();
			

		},

		turned: function(e, page, view) {

			var book = $(this);

			$('#slider').slider('value', getViewNumber(book, page));

			if (page!=1 && page!=book.turn('pages'))
				$('.sample-docs .tabs').fadeIn(500);
			else
				$('.sample-docs .tabs').hide();

			book.turn('center');
			updateTabs();

		},

		start: function(e, pageObj) {
	
			moveBar(true);

		},

		end: function(e, pageObj) {
		
			var book = $(this);

			setTimeout(function() {
				$('#slider').slider('value', getViewNumber(book));
			}, 1);

			moveBar(false);

		},

		missing: function (e, pages) {

			for (var i = 0; i < pages.length; i++)
				addPage(pages[i], $(this));

		}
	}
	}). turn('page', 1);


	$('#slider').slider('option', 'max', numberOfViews(flipbook));

	var baseWidth = 942;
	var baseHeight = 600;
	var zoomLevel = 1;
	var fitScale = 1;

	function fitToViewport() {
		var canvasWidth = $('#canvas').width();
		var canvasHeight = $('#canvas').height();
		var availableWidth = canvasWidth - 60;
		var availableHeight = canvasHeight - 190;
		fitScale = Math.min(
			availableWidth / baseWidth,
			availableHeight / baseHeight
		);
		fitScale = Math.max(0.55, Math.min(1, fitScale));
		zoomLevel = fitScale;
		applyZoom();
		return fitScale;
	}

	function applyZoom() {
		var width = Math.round(baseWidth * zoomLevel);
		var height = Math.round(baseHeight * zoomLevel);
		flipbook.turn('size', width, height);
		flipbook.css({
			marginLeft: 'auto',
			marginRight: 'auto'
		});
		flipbook.turn('center');
	}

	function jumpToPage(value) {
		var page = parseInt(value, 10);
		if (isNaN(page)) return;
		page = Math.max(1, Math.min(flipbook.turn('pages'), page));
		flipbook.turn('page', page);
		$('#page-jump').val(page);
	}

	$('.nav-btn.home-btn').on('click', function(e) {
		e.preventDefault();
		jumpToPage(1);
	});

	$('.nav-btn.prev').on('click', function(e) {
		e.preventDefault();
		$('.sample-docs').turn('previous');
		$('#page-jump').val($('.sample-docs').turn('page'));
	});

	$('.nav-btn.next').on('click', function(e) {
		e.preventDefault();
		$('.sample-docs').turn('next');
		$('#page-jump').val($('.sample-docs').turn('page'));
	});

	$('.nav-btn.fit').on('click', function(e) {
		e.preventDefault();
		fitToViewport();
	});

	$('.nav-btn.zoom-out').on('click', function(e) {
		e.preventDefault();
		zoomLevel = Math.max(0.55, Number((zoomLevel - 0.1).toFixed(2)));
		applyZoom();
	});

	$('.nav-btn.zoom-in').on('click', function(e) {
		e.preventDefault();
		zoomLevel = Math.min(1.2, Number((zoomLevel + 0.1).toFixed(2)));
		applyZoom();
	});

	$('.nav-btn.full').on('click', function(e) {
		e.preventDefault();
		if (!document.fullscreenElement) {
			if (document.documentElement.requestFullscreen) {
				document.documentElement.requestFullscreen();
			}
		} else if (document.exitFullscreen) {
			document.exitFullscreen();
		}
	});

	$('.jump-btn').on('click', function(e) {
		e.preventDefault();
		jumpToPage($('#page-jump').val());
	});

	$('#page-jump').on('keydown', function(e) {
		if (e.key === 'Enter') {
			e.preventDefault();
			jumpToPage($(this).val());
		}
	});

	$(window).on('resize', function() {
		fitToViewport();
	});

	flipbook.on('turned', function() {
		$('#page-jump').val(flipbook.turn('page'));
	});

	flipbook.addClass('animated');
	fitToViewport();


	// Show canvas

	$('#canvas').css({visibility: 'visible'});
}

// Hide canvas

$('#canvas').css({visibility: 'visible'});

yepnope({
	test: Modernizr.csstransforms,
	yep: ['files/lib/turn.min.js', 'files/css/jquery.ui.css'],
	nope: ['files/lib/turn.html4.min.js', 'files/css/jquery.ui.html4.css'],
	both: ['files/css/docs.css', 'files/js/docs.js'],
	complete: loadApp
});

</script>

</body>
</html>
